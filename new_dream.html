{% extends "base.html" %}
{% block title %}Record a Dream — Enchanted Dreams{% endblock %}

{% block content %}
<section class="hero" style="padding-bottom:10px;">
  <div class="eyebrow">before it fades</div>
  <h1>Record a Dream</h1>
  <p>Write it down as you remember it — the fragments are welcome too.</p>
</section>

<form method="POST" class="auth-shell" style="max-width:640px;">
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" placeholder="The lighthouse that wasn't there" value="{{ form.get('title', '') }}" required maxlength="120" />
  </div>

  <div class="field">
    <label for="content">What did you see?</label>
    <textarea id="content" name="content" placeholder="Describe the dream in as much or as little detail as you remember..." required>{{ form.get('content', '') }}</textarea>
  </div>

  <div class="field">
    <label for="mood">Mood</label>
    <select id="mood" name="mood">
      {% for m in moods %}
        <option value="{{ m }}" {{ 'selected' if form.get('mood') == m }}>{{ m }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label>Visibility</label>
    <div class="visibility-choice">
      <label class="seal-option">
        <input type="radio" name="visibility" value="private" {{ 'checked' if form.get('visibility', 'private') == 'private' }} />
        <div class="seal-title">🕯️ Sealed</div>
        <div class="seal-desc">Only you can read this dream.</div>
      </label>
      <label class="seal-option">
        <input type="radio" name="visibility" value="public" {{ 'checked' if form.get('visibility') == 'public' }} />
        <div class="seal-title">🌊 Shared</div>
        <div class="seal-desc">Appears in the archive; others can discuss it with you.</div>
      </label>
    </div>
  </div>

  <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Seal it into the archive</button>
</form>
{% endblock %}

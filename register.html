{% extends "base.html" %}
{% block title %}Join — Enchanted Dreams{% endblock %}

{% block content %}
<div class="auth-shell">
  <h1>✨ Join</h1>
  <div class="sub">Begin your journal and choose your sigil</div>
  <form method="POST">
    <div class="field">
      <label for="username">Choose a name</label>
      <input type="text" id="username" name="username" required minlength="3" autofocus />
    </div>
    <div class="field">
      <label for="password">Choose a passphrase</label>
      <input type="password" id="password" name="password" required minlength="4" />
      <div class="hint">at least 4 characters</div>
    </div>
    <div class="field">
      <label for="confirm">Confirm passphrase</label>
      <input type="password" id="confirm" name="confirm" required minlength="4" />
    </div>
    <button type="submit" class="btn btn-primary">Begin</button>
  </form>
  <div class="switch">Already a dreamer? <a href="{{ url_for('login') }}">Enter</a></div>
</div>
{% endblock %}

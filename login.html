{% extends "base.html" %}
{% block title %}Enter — Enchanted Dreams{% endblock %}

{% block content %}
<div class="auth-shell">
  <h1>🌙 Enter</h1>
  <div class="sub">Return to your journal and the circle</div>
  <form method="POST">
    <div class="field">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Passphrase</label>
      <input type="password" id="password" name="password" required />
    </div>
    <button type="submit" class="btn btn-primary">Enter the circle</button>
  </form>
  <div class="switch">New here? <a href="{{ url_for('register') }}">Join Enchanted Dreams</a></div>
</div>
{% endblock %}
